# =========================================================
# 应用运行参数 · APP_ENV=dev
#
# - 本文件只放非敏感参数；凭据统一写在仓库根目录 .secrets。
# - 密钥字段（*_PASSWORD / *_SECRET / *_API_KEY 等）出现在本文件会导致启动失败。
# - 四个环境文件保持同名 table 和字段；关闭能力用明确取值表达，不靠缺失字段表达。
# - 使用嵌套 TOML table，字段名与 Settings 分组模型一致。
# - 运行时只加载本文件与 .secrets；除 APP_ENV 外不从 shell 环境变量兜底读取配置。
# - Compose 部署时本文件按 APP_ENV 只读挂载到容器内 /app/configs/app.dev.toml。
# =========================================================

# --- 运行与调试 ---

# 调试模式；true 时暴露 /docs、/redoc 并输出更详细的错误信息，生产必须为 false。
debug = true

# 日志格式：text 便于阅读，json 便于集中采集与检索。

[log]
format = "text"

# 是否追加写入 <log.base_dir>/app.log；应用内不做轮转，长期开启必须配外部 logrotate。
# 本环境为 console-only，因此不配置 log.base_dir（该字段在文件输出开启时必填）。
write_to_file = false

# 是否输出到控制台；与 log.write_to_file 不能同时为 false。
write_to_console = true

# 启动配置回显是否显示敏感值；仅本地诊断时临时开启，默认保持 false。

[config_echo]
reveal_secrets = false

# CORS 允许来源（TOML 数组）；["*"] 只适合开发环境，正式环境应替换为具体域名。

[cors]
origins = ["*"]

# 微信登录授权类型，授权码模式固定为 authorization_code。

[wechat]
grant_type = "authorization_code"

# --- OpenTelemetry ---

# 是否启用链路追踪；true 时必须配置 otel.exporter_otlp_traces_endpoint。

[otel]
tracing_enabled = true
# FastAPI 操作 Span 仅在 tracing 开启时生效。
operation_spans_enabled = true
# Metrics 和 OTel Logs 需要对应的 Provider。
metrics_enabled = false
logs_enabled = false
# exporter 由 Settings 管理，当前必须关闭框架的环境变量自动配置。
auto_configure = false

# 上报到 Collector 的 service.name。
service_name = "agent-backend"

# OTLP/HTTP Trace 接收地址（含 /v1/traces 路径）。
exporter_otlp_traces_endpoint = "http://127.0.0.1:4318/v1/traces"

# 单次导出超时（秒）。
exporter_otlp_timeout_seconds = 10

# --- 认证与令牌 ---

# access token 的签名算法，签发与校验两侧必须一致。

[auth.jwt]
algorithm = "HS256"

# --- 数据库（主库） ---

# 数据库类型：mysql 或 postgresql，决定使用的驱动。


[auth.access_token]
expire_seconds = 1800

# 待确认 Agent 动作的有效期（秒），超时后确认失效。

[db]
type = "postgresql"

# 主库地址、端口、用户名与库名；密码写在 .secrets 的 DB_PASSWORD。
host = "postgresql"
port = 5432
username = "postgres"
database = "agent_backend"

# 是否打印 SQL 语句；开发环境排查用，生产保持 false。
echo = true

# 只读副本为条件配置：需要读写分离时在本文件补充 db.read_replica.host / db.read_replica.port /
# db.read_replica.username / db.read_replica.database，并在 .secrets 增加 DB_READ_PASSWORD；
# 未配置 db.read_replica.host 时读会话回落到主库。

# --- Redis ---

# Redis 地址；密码写在 .secrets 的 REDIS_PASSWORD，无密码时留空。


# 只读副本为可选配置；启用时配置 read replica，密码写在 .secrets 的 DB_READ_PASSWORD。
# [db.read_replica]
# host = "replica-db"
# port = 5432
# username = "reader"
# database = "agent_backend"
[redis]
host = "127.0.0.1"

# 逻辑库编号；各环境使用不同 DB 便于隔离数据。
db = 0

# Redis 端口。
port = 6379

# --- Celery PostgreSQL 幂等状态机 ---

# 是否启用基于 PostgreSQL 的幂等状态机；开启要求 db.type=postgresql。

[celery]
idempotency_enabled = true

# task time limit 之外的状态收敛宽限（秒），上限 300。
execution_deadline_grace_seconds = 30

# 消息确认入队后允许等待 Worker claim 的时间（秒）；必须大于 celery.reconciler_interval_seconds。
queue_start_timeout_seconds = 300

# SUBMITTING 发布确认超时（秒）；必须大于 celery.publish_reconciler_interval_seconds。
publish_confirm_timeout_seconds = 30

# 发布确认 Reconciler 周期（秒）。
publish_reconciler_interval_seconds = 10

# ORPHANED 状态外部副作用隔离窗口（秒）。
orphan_fence_seconds = 300

# 是否由 Beat 周期触发 deadline Reconciler。
reconciler_beat_enabled = true

# deadline Reconciler 周期（秒）。
reconciler_interval_seconds = 60

# deadline Reconciler 单轮收敛记录数上限。
reconciler_batch_size = 100

# Reconciler 专用队列名，需与 Worker 的 -Q 列表一致。
reconciler_queue = "celery_maintenance_queue"

# 单个任务载荷上限（字节），超过即拒绝；262144 = 256 KiB。
task_max_payload_bytes = 262144

# --- 令牌有效期与 Agent 动作 ---

# access token 有效期（秒）；1800 = 30 分钟。

[agent]
action_confirmation_seconds = 300

# Agent 动作幂等窗口（秒）；同一幂等键在窗口内只执行一次。
action_idempotency_seconds = 86400

# --- Agent 受管理运行（打断 / 恢复） ---

# 执行者 lease 时长（秒）；超时未续租的 run 允许被下一次 resume 原子接管。
lease_seconds = 30

# heartbeat / control 轮询周期（秒）；必须小于 agent.lease_seconds。
control_poll_seconds = 5

# 取消收尾预算（秒）；必须覆盖一次 LLM 调用的剩余超时与 checkpoint 提交预算，上限 300。
cancel_grace_seconds = 70

# 执行事件到响应发送之间的有界通道容量；通道积压说明客户端消费过慢。
stream_buffer_size = 16

# 单个 checkpoint JSON 的大小上限（字节）；超出时明确失败而不是截断后继续推理。
checkpoint_max_bytes = 1048576

# Agent LLM 调用超时（秒）；必须被 agent.cancel_grace_seconds 覆盖。
llm_timeout_seconds = 60

# --- RAG 检索范围 ---

# 允许检索的知识域白名单（TOML 数组），与请求域取交集；为空会返回 rag_scope_empty。

[rag]
allowed_domains = ["order", "payment", "general"]

# 允许检索的知识库 ID 白名单（TOML 数组，只接受 >0 的值），同样与请求取交集。
allowed_kb_ids = [1, 2, 3]

# 拼装进 prompt 的检索上下文最大字符数。
max_context_chars = 12000

# --- LLM（Chat / Agent 推理） ---

# 默认 provider 标识；实际读取 llm.<provider>.base_url / model 与 .secrets 中的 provider API key，缺失时接口返回 503。

[llm]
default_provider = "mimo"

# 小米 MiMo provider 的地址与模型；服务与模型必须支持 Responses API，API key 写在 .secrets。

[llm.mimo]
base_url = "https://api.xiaomimimo.com/v1"
model = "mimo-v2.5-pro"

# DeepSeek provider 的地址与模型；API key 写在 .secrets。

[llm.deepseek]
base_url = "https://api.deepseek.com"
model = "deepseek-v4-flash"

# --- Embedding（向量化） ---

# provider 类型；当前仅支持 openai_compatible（OpenAI-compatible /embeddings 协议）。

[embedding]
provider = "openai_compatible"

# embedding 服务地址与模型名；API key 写在 .secrets，服务无鉴权时留空。
base_url = "http://bge-embedding:8000/v1"
model = "bge-m3"

# 向量维度；必须与模型输出维度和向量 collection schema 一致，改动需重建集合。
dimension = 1024

# 单次向量化请求超时（秒）。
timeout_seconds = 60

# --- 向量库 Milvus ---

# Milvus 地址（http(s)://host:port）。

[milvus]
uri = "http://127.0.0.1:19530"

# Milvus database 名，不能为空。
db_name = "default"

# Milvus 连接与请求超时（秒）。
timeout_seconds = 10

# --- Endpoint Guard（指定 endpoint 的禁用 / 拒绝） ---

# 是否启用 endpoint guard 中间件。

[endpoint_guard]
enabled = true

# 规则来源：settings（本文件静态规则）、redis（动态下发）、settings+redis（两者合并）。
source = "settings"

# settings 来源的规则，TOML 数组；[] 表示没有静态规则。
rules = []

# Redis 中存放规则的 key（来源包含 redis 时生效）。
redis_key = "endpoint_guard:rules"

# 规则缓存 TTL（秒）；调小可让规则变更更快生效。
cache_ttl_seconds = 10

# Redis 不可用时的策略：true 放行（fail-open），false 拦截（fail-closed）。
fail_open = true
