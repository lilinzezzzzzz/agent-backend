[project]
name = "agent-backend"
version = "0.1.0"
description = "Agent backend infrastructure based on FastAPI"
readme = "README.md"
requires-python = ">=3.12"

# 生产运行时依赖：只保留真正业务需要 import 的模块
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "starlette>=0.52.1",
    "pydantic>=2.12.5",
    "annotated-types>=0.7.0",
    "anyio>=4.12.1",
    "httpx>=0.28.1",
    "h11>=0.16.0",
    "httpcore>=1.0.9",
    "idna>=3.11",
    "SQLAlchemy>=2.0.47",
    "asyncpg>=0.31.0",
    "numpy>=2.4.2",
    "pandas>=3.0.1",
    "celery>=5.6.2",
    "APScheduler>=3.11.2",
    "amqp>=5.3.1",
    "kombu>=5.6.2",
    "billiard>=4.2.4",
    "vine>=5.1.0",
    "celery-types>=0.24.0",
    "redis>=7.2.1",
    "loguru>=0.7.3",
    "PyJWT>=2.11.0",
    "bcrypt>=5.0.0",
    "python-dotenv>=1.2.2",
    "shortuuid>=1.0.13",
    "snowflake-id>=1.0.2",
    "openai>=2.24.0",
    "orjson>=3.11.7",
    "tqdm>=4.67.3",
    "jiter>=0.13.0",
    "protobuf>=6.33.5",
    "grpcio>=1.78.0",
    "grpcio-tools>=1.78.0",
    "certifi>=2026.2.25",
    "click>=8.3.1",
    "packaging>=26.0",
    "python-dateutil>=2.9.0.post0",
    "pytz>=2025.2",
    "tzdata>=2025.3",
    "tzlocal>=5.3.1",
    "typing-extensions>=4.15.0",
    "typing-inspection>=0.4.2",
    "xxhash>=3.6.0",
    "uvloop>=0.22.1; sys_platform != 'win32'",
    "httptools>=0.7.1",
    "async-lru>=2.2.0",
    "celery-redbeat>=2.3.3",
    "trio>=0.33.0",
    "pydantic-settings>=2.13.1",
    "cryptography>=46.0.5",
    "oss2>=2.19.1",
    "boto3>=1.42.59",
    "boto3-stubs>=1.42.59",
    "uuid6>=2025.0.1",
    "pyyaml>=6.0.3",
    "aiosqlite>=0.22.1",
    "pymilvus>=2.6.10",
    "wordfreq>=3.1.1",
    "mcp>=1,<2",
    "pypinyin>=0.55.0",
    "agentscope>=2,<3",
    "opentelemetry-api>=1.42.1,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1,<2",
    "opentelemetry-sdk>=1.42.1,<2",
]

# 分组依赖 —— 开发环境才需要
[dependency-groups]
dev = [
    "pip>=25.3",
    "setuptools>=79.0.1",
    "wheel>=0.45.1",
    # 常规开发工具（可根据你需要继续添加）
    "pytest",
    "pytest-asyncio",
    "httpx",
    "black",
    "mypy",
    "types-redis",
    "types-pytz",
    "pandas-stubs>=2.3.3.251201",
    "twisted>=25.5.0",
    "pytest-tornasync>=0.6.0.post2",
    "pytest-trio>=0.8.0",
    "pytest-twisted>=1.14.3",
    "ruff>=0.15.15",
]

[tool.uv]
package = false
default-groups = []

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
default = true
python-downloads = false

[tool.pytest.ini_options]
markers = [
    "integration: 集成测试，需要外部服务或完整基础设施",
]

[tool.fastapi]
entrypoint = "entrypoints.main:app"
